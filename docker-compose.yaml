version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: lego_db
    environment:
      POSTGRES_USER: lego_user
      POSTGRES_PASSWORD: lego_password
      POSTGRES_DB: lego_database
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5432:5432'

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - '6379:6379'

  app:
    build:
      context: .
    container_name: lego_app
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: lego_user
      DATABASE_PASSWORD: lego_password
      DATABASE_NAME: lego_database
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '3000:3000'
    depends_on:
      - db
      - redis

volumes:
  db_data:
